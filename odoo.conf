[options]
admin_passwd = admin
proxy_mode = True

db_host = dpg-d7br0redqaus73as2kkg-a.frankfurt-postgres.render.com
db_port = 5432
db_user = vibe_odoo_db_user
db_password = 1pzlftiECI121CR5IG1RUmwQ6fQSDDjk
db_name = odin_template

http_port = 8069
http_interface = 0.0.0.0


; Security
list_db = True

; Performance (requires Standard instance minimum)
;
; workers MUST stay 0 on Render. In prefork mode (workers >= 1) Odoo serves
; /websocket from a separate gevent process on gevent_port, but Render routes
; all external traffic to a single port, so those requests land on the HTTP
; workers instead and die with "Couldn't bind the websocket". In threaded mode
; ThreadedServer's request handler hands the raw TCP socket to the websocket on
; http_port itself, so Discuss/chatter/notifications work with one port.
; Going back to workers >= 1 requires a reverse proxy inside the container
; routing /websocket -> gevent_port and everything else -> http_port.
workers = 0
gevent_port = 8072
max_cron_threads = 1
db_maxconn = 15

; Memory (2GB instance)
limit_memory_soft = 1610612736
limit_memory_hard = 2040109465
limit_time_cpu = 60
limit_time_real = 120

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/usr/lib/python3/dist-packages/addons,/var/lib/odoo/custom_addons,/opt/custom_addons
