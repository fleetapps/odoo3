db_name = odin_template

http_port = 8069
http_interface = 0.0.0.0


; Security
list_db = False

; Performance (requires Standard instance minimum)
;
; workers MUST stay 0 on Render. In prefork mode (workers >= 1) Odoo serves
; /websocket from a separate gevent process on gevent_port, but Render routes
; all external traffic to a single port, so those requests land on the HTTP
; workers instead and die with "Couldn't bind the websocket". In threaded mode
; ThreadedServer's request handler hands the raw TCP socket to the websocket on
; http_port itself, so Discuss/chatter/notifications work with one port.
; Going back to workers >= 1 requires a reverse proxy inside the container
; routing /websocket -> gevent_port and everything else -> http_port.
workers = 0
gevent_port = 8072
max_cron_threads = 1
db_maxconn = 15

; Memory (2GB instance)
limit_memory_soft = 1610612736
limit_memory_hard = 2040109465
limit_time_cpu = 60
limit_time_real = 120

# /opt/custom_addons is listed BEFORE /var/lib/odoo/custom_addons and the
# order is load-bearing. Odoo resolves a module from the first addons path
# that contains it (odoo/modules/module.py, Manifest._get_manifest_from_addons
# returns on the first hit, and initialize_sys_path appends these in the
# order written here). /var/lib/odoo is a VOLUME in the odoo:19.0 base image,
# so a Render Disk mounted there persists across deploys — any stale copy of
# a module left in it would outrank the freshly built one baked into /opt at
# image build time, and every deploy would silently keep serving old code.
# It is kept in the list, last, so a module that exists only on the disk is
# still found.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/usr/lib/python3/dist-packages/addons,/opt/custom_addons,/var/lib/odoo/custom_addons
